<!DOCTYPE html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garage for Tesla — mockup</title>
<style>
html,body{margin:0;height:100%;background:#0a0a0b;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body.light{background:#e8e9ec;color-scheme:light}
#demo{height:48px;display:flex;align-items:center;gap:18px;padding:0 18px;font-size:13px;color:#ddd;background:#1c1c1e;border-bottom:1px solid #2c2c2e;overflow-x:auto;white-space:nowrap}
body.light #demo{background:#fff;color:#222;border-color:#ddd}
#demo .sp{flex:1}#demo label{display:flex;align-items:center;gap:6px}
#demo select{font:inherit;padding:4px 6px;border-radius:8px;border:1px solid #444;background:#2c2c2e;color:#fff}
#demo select option{background:#2c2c2e;color:#fff}
body.light #demo select{border-color:#ccc;background:#fff;color:#111}
body.light #demo select option{background:#fff;color:#111}
#app{height:calc(100vh - 49px);--header-height:49px}
#app.mobile{width:430px;max-width:100%;margin:0 auto;height:calc(100vh - 49px);overflow:hidden;box-shadow:0 0 0 1px #333}
</style></head>
<body><div id="demo"></div><div id="app"></div>
<script src="./car-model.js"></script>
<script src="./wc-model.js"></script>
<script src="./sc-model.js"></script>
<script type="module" src="./garage-for-tesla-card.js"></script>
<script type="module" src="./harness.bundle.js"></script>
</body></html>
